version: '3.8'

networks:
  proxy_net:
    external: true
  fleetops_internal:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetops_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://fleetuser:fleetpass@db:5432/fleetops_db?schema=public
    networks:
      - proxy_net
      - fleetops_internal
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:16-alpine
    container_name: fleetops_db
    restart: always
    environment:
      POSTGRES_DB: fleetops_db
      POSTGRES_USER: fleetuser
      POSTGRES_PASSWORD: fleetpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fleetops_internal

volumes:
  postgres_data:
